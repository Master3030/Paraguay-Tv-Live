<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PY TV PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #e50914;
            --bg: #070707;
            --card: #111;
            --border: #1a1a1a;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { background:var(--bg); color:#fff; font-family:'Inter',sans-serif; }

        /* HEADER */
        header {
            position:sticky; top:0; z-index:300;
            height:54px; display:flex; align-items:center; justify-content:space-between;
            padding:0 16px; background:rgba(7,7,7,0.96); border-bottom:1px solid var(--border);
            backdrop-filter:blur(12px);
        }
        .logo {
            font-family:'Bebas Neue',sans-serif; font-size:1.5rem; letter-spacing:4px;
            background:linear-gradient(90deg,#fff 50%,var(--red)); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .dot { width:8px; height:8px; border-radius:50%; background:#2ecc71; box-shadow:0 0 6px #2ecc71; animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        /* PLAYER */
        #playerBox {
            display:none; position:sticky; top:54px; z-index:200;
            background:#000; border-bottom:2px solid var(--red);
        }
        video { width:100%; aspect-ratio:16/9; display:block; background:#000; }
        .player-bar {
            display:flex; align-items:center; justify-content:space-between;
            padding:8px 14px; background:#0d0d0d; gap:10px;
        }
        .live-badge {
            font-size:.6rem; font-weight:700; letter-spacing:1px;
            background:var(--red); color:#fff; padding:2px 7px; border-radius:4px;
        }
        #playingTitle { font-size:.8rem; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        #retryInfo { font-size:.65rem; color:#aaa; white-space:nowrap; }
        .close-btn {
            background:none; border:1px solid #333; color:#aaa; border-radius:6px;
            padding:4px 10px; font-size:.75rem; cursor:pointer; flex-shrink:0;
        }
        .close-btn:hover { border-color:var(--red); color:var(--red); }

        /* STATUS BAR */
        #statusBar {
            display:none; font-size:.7rem; text-align:center; padding:5px;
            background:#1a0000; color:#ff6b6b; border-bottom:1px solid #3a0000;
        }

        /* FILTROS */
        .filters {
            display:flex; gap:8px; padding:12px 14px; overflow-x:auto;
            scrollbar-width:none; border-bottom:1px solid var(--border);
        }
        .filters::-webkit-scrollbar { display:none; }
        .filter-btn {
            flex-shrink:0; padding:5px 14px; border-radius:20px; font-size:.75rem;
            font-weight:600; border:1px solid #333; background:transparent; color:#888; cursor:pointer;
            transition:all .2s;
        }
        .filter-btn.active { background:var(--red); border-color:var(--red); color:#fff; }

        /* GRID */
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; padding:14px; }
        .card {
            background:var(--card); border-radius:14px; padding:14px 10px; text-align:center;
            border:1px solid var(--border); cursor:pointer; transition:transform .15s, border-color .15s;
            position:relative; overflow:hidden;
        }
        .card:active { transform:scale(.95); }
        .card.playing { border-color:var(--red); box-shadow:0 0 14px rgba(229,9,20,.25); }
        .card::before {
            content:''; position:absolute; inset:0;
            background:linear-gradient(135deg,rgba(255,255,255,.04),transparent);
            pointer-events:none;
        }
        .card img {
            width:100%; height:44px; object-fit:contain; filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));
        }
        .card-name { font-size:.72rem; font-weight:700; margin-top:9px; letter-spacing:.5px; color:#ddd; }
        .card-cat { font-size:.6rem; color:#555; margin-top:2px; text-transform:uppercase; letter-spacing:.5px; }
        .card .play-icon {
            position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
            background:rgba(229,9,20,.85); opacity:0; transition:opacity .2s; font-size:1.5rem;
        }
        .card:hover .play-icon { opacity:.9; }

        /* LOADER */
        #loader { text-align:center; padding:40px 20px; color:#444; }
        .spinner { width:32px; height:32px; border:3px solid #222; border-top-color:var(--red); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 12px; }
        @keyframes spin { to{transform:rotate(360deg)} }

        /* FOOTER */
        footer { text-align:center; padding:20px; color:#333; font-size:.65rem; border-top:1px solid var(--border); }
    </style>
</head>
<body>

<header>
    <div class="logo">PY TV PRO</div>
    <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:.65rem;color:#555;" id="headerTime"></span>
        <div class="dot" id="statusDot"></div>
    </div>
</header>

<div id="playerBox">
    <video id="video" controls playsinline webkit-playsinline></video>
    <div class="player-bar">
        <span class="live-badge">EN VIVO</span>
        <span id="playingTitle">Cargando...</span>
        <span id="retryInfo"></span>
        <button class="close-btn" onclick="closePlayer()">✕ CERRAR</button>
    </div>
</div>

<div id="statusBar"></div>

<div class="filters" id="filters"></div>

<div id="loader">
    <div class="spinner"></div>
    <div>Cargando canales...</div>
</div>

<div class="grid" id="grid"></div>

<footer>PY TV PRO &nbsp;·&nbsp; <span id="footerDate"></span></footer>

<script>
// ═══════════════════════════════════════════════
//  CONFIGURACIÓN — solo editar esto
// ═══════════════════════════════════════════════
const GITHUB_TOKEN = "TU_TOKEN_AQUÍ";
const DATA_URL = "https://api.github.com/repos/Master3030/paraguay-tv/contents/pylivetvprivado.json";

// Proxies HLS en orden de preferencia para streams que tienen CORS bloqueado.
// Si el primero falla automáticamente rota al siguiente.
const PROXIES = [
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    url => url   // intento directo como último recurso
];

// ═══════════════════════════════════════════════
//  ESTADO
// ═══════════════════════════════════════════════
let hls = null;
let currentUrl = null;
let currentName = null;
let currentProxyIdx = 0;
let retryCount = 0;
let retryTimer = null;
let allChannels = [];
let activeFilter = "Todos";
let activeCard = null;

// ═══════════════════════════════════════════════
//  INICIO
// ═══════════════════════════════════════════════
window.onload = () => {
    updateClock();
    setInterval(updateClock, 1000);
    document.getElementById('footerDate').textContent = new Date().toLocaleDateString('es-PY', {year:'numeric',month:'long',day:'numeric'});
    loadChannels();
};

function updateClock() {
    const now = new Date();
    document.getElementById('headerTime').textContent =
        now.toLocaleTimeString('es-PY', {hour:'2-digit',minute:'2-digit'});
}

// ═══════════════════════════════════════════════
//  CARGA DE DATOS
// ═══════════════════════════════════════════════
async function loadChannels() {
    try {
        const res = await fetch(DATA_URL, {
            headers: {
                'Authorization': `token ${GITHUB_TOKEN}`,
                'Accept': 'application/vnd.github.v3.raw',
                'Cache-Control': 'no-cache'
            }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        allChannels = data.canales || [];
        buildFilters(allChannels);
        renderGrid(allChannels);
        document.getElementById('loader').style.display = 'none';
    } catch (e) {
        document.getElementById('loader').innerHTML = `
            <div style="color:#e50914;margin-bottom:10px;">⚠ Error al cargar canales</div>
            <div style="font-size:.75rem;color:#555;">${e.message}</div>
            <button onclick="loadChannels()" style="margin-top:14px;padding:8px 20px;background:var(--red);color:#fff;border:none;border-radius:8px;cursor:pointer;">Reintentar</button>`;
    }
}

// ═══════════════════════════════════════════════
//  FILTROS POR CATEGORÍA
// ═══════════════════════════════════════════════
function buildFilters(list) {
    const cats = ["Todos", ...new Set(list.map(c => c.categoria))];
    const container = document.getElementById('filters');
    container.innerHTML = cats.map(cat => `
        <button class="filter-btn ${cat === 'Todos' ? 'active' : ''}" onclick="setFilter('${cat}')">${cat}</button>
    `).join('');
}

function setFilter(cat) {
    activeFilter = cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.textContent === cat));
    const filtered = cat === 'Todos' ? allChannels : allChannels.filter(c => c.categoria === cat);
    renderGrid(filtered);
}

// ═══════════════════════════════════════════════
//  GRID DE CANALES
// ═══════════════════════════════════════════════
function renderGrid(list) {
    document.getElementById('grid').innerHTML = list.map(c => `
        <div class="card" id="card-${c.id}" onclick="play('${c.url}','${escHtml(c.nombre)}','${c.id}')">
            <img src="${c.logo}" onerror="this.src='https://placehold.co/120x44/111/444?text=TV'" loading="lazy">
            <div class="card-name">${c.nombre}</div>
            <div class="card-cat">${c.categoria}</div>
            <div class="play-icon">▶</div>
        </div>
    `).join('');
}

function escHtml(s) { return s.replace(/'/g,"&#39;"); }

// ═══════════════════════════════════════════════
//  REPRODUCTOR — lógica principal
// ═══════════════════════════════════════════════
function play(encodedUrl, name, cardId) {
    // Decodificar URL base64
    let rawUrl;
    try { rawUrl = atob(encodedUrl); }
    catch(e) { rawUrl = encodedUrl; }

    // Marcar tarjeta activa
    if (activeCard) document.getElementById(`card-${activeCard}`)?.classList.remove('playing');
    activeCard = cardId;
    document.getElementById(`card-${cardId}`)?.classList.add('playing');

    // Guardar contexto para reintentos
    currentUrl = rawUrl;
    currentName = name;
    currentProxyIdx = 0;
    retryCount = 0;

    document.getElementById('playerBox').style.display = 'block';
    document.getElementById('playingTitle').textContent = name;
    document.getElementById('retryInfo').textContent = '';
    hideStatus();

    loadStream(rawUrl, 0);

    // Scroll al player
    document.getElementById('playerBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function loadStream(rawUrl, proxyIdx) {
    const video = document.getElementById('video');
    video.pause();

    if (hls) { hls.destroy(); hls = null; }
    clearTimeout(retryTimer);

    const proxiedUrl = PROXIES[proxyIdx](rawUrl);
    console.log(`[PY-TV] Intentando proxy ${proxyIdx}: ${proxiedUrl}`);

    if (Hls.isSupported()) {
        hls = new Hls({
            // — Configuración anti-corte —
            enableWorker: true,
            lowLatencyMode: false,           // OFF para streams VOD-style/DVR
            liveSyncDurationCount: 5,        // mantiene 5 segmentos en buffer
            liveMaxLatencyDurationCount: 15, // acepta hasta 15 seg de retraso
            maxBufferLength: 90,             // buffer máximo 90 seg
            maxMaxBufferLength: 120,
            backBufferLength: 60,
            maxBufferHole: 1.5,              // tolera huecos de 1.5 seg
            // — Reintentos agresivos —
            manifestLoadingMaxRetry: 6,
            manifestLoadingRetryDelay: 1000,
            levelLoadingMaxRetry: 6,
            levelLoadingRetryDelay: 1000,
            fragLoadingMaxRetry: 8,
            fragLoadingRetryDelay: 500,
            // — Timeout generoso para streams lentos —
            manifestLoadingTimeOut: 20000,
            levelLoadingTimeOut: 20000,
            fragLoadingTimeOut: 25000,
        });

        hls.loadSource(proxiedUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(() => {});
            document.getElementById('retryInfo').textContent = '';
            hideStatus();
            scheduleKeepalive(); // 👈 antídoto al corte de 50s
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
            console.warn(`[PY-TV] Error HLS (fatal:${data.fatal}) tipo:${data.type} det:${data.details}`);
            if (!data.fatal) return; // errores no fatales: HLS.js los maneja solo

            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                // Intentar recuperación de red primero
                if (retryCount < 2) {
                    retryCount++;
                    showStatus(`⚠ Error de red, reintentando... (${retryCount}/2)`);
                    hls.startLoad();
                } else {
                    // Rotar al siguiente proxy
                    tryNextProxy();
                }
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                showStatus('⚠ Error de media, recuperando...');
                hls.recoverMediaError();
            } else {
                tryNextProxy();
            }
        });

    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari nativo
        video.src = proxiedUrl;
        video.play().catch(() => {});
        scheduleKeepalive();
    } else {
        showStatus('⚠ Tu navegador no soporta HLS');
    }
}

// ═══════════════════════════════════════════════
//  ROTACIÓN DE PROXY
// ═══════════════════════════════════════════════
function tryNextProxy() {
    clearTimeout(retryTimer);
    const next = currentProxyIdx + 1;
    if (next < PROXIES.length) {
        currentProxyIdx = next;
        retryCount = 0;
        showStatus(`🔄 Cambiando servidor (${next}/${PROXIES.length - 1})...`);
        retryTimer = setTimeout(() => loadStream(currentUrl, next), 1500);
    } else {
        // Ciclo completo: empezar de nuevo después de 8 seg
        currentProxyIdx = 0;
        retryCount = 0;
        showStatus(`⏳ Reconectando en 8 seg... (${currentName})`);
        retryTimer = setTimeout(() => loadStream(currentUrl, 0), 8000);
    }
}

// ═══════════════════════════════════════════════
//  KEEPALIVE — evita el corte de 50-60 seg
//  El problema real: algunos proxies cierran la
//  conexión HTTP idle. Forzar un "pull" periódico
//  mantiene viva la conexión.
// ═══════════════════════════════════════════════
let keepaliveInterval = null;

function scheduleKeepalive() {
    clearInterval(keepaliveInterval);
    keepaliveInterval = setInterval(() => {
        if (!hls || !currentUrl) return;
        const video = document.getElementById('video');
        // Si el video está parado y no es por pausa del usuario, reiniciar
        if (!video.paused && video.readyState < 3) {
            console.log('[PY-TV] Keepalive: stream estancado, recargando...');
            loadStream(currentUrl, currentProxyIdx);
        }
    }, 20000); // chequeo cada 20 seg
}

// ═══════════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════════
function showStatus(msg) {
    const bar = document.getElementById('statusBar');
    bar.textContent = msg;
    bar.style.display = 'block';
    document.getElementById('retryInfo').textContent = '↻';
}

function hideStatus() {
    document.getElementById('statusBar').style.display = 'none';
}

function closePlayer() {
    clearTimeout(retryTimer);
    clearInterval(keepaliveInterval);
    const video = document.getElementById('video');
    video.pause();
    if (hls) { hls.destroy(); hls = null; }
    document.getElementById('playerBox').style.display = 'none';
    hideStatus();
    if (activeCard) {
        document.getElementById(`card-${activeCard}`)?.classList.remove('playing');
        activeCard = null;
    }
}
</script>
</body>
</html>
